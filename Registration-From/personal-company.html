<body class="company-page">
<main class="card company-card"><h1>Account Registration</h1><form><label>Account Type</label><label><input type="radio" name="type" required> Personal</label><label><input type="radio" name="type"> Company</label><label for="name">Full Name / Company Name</label><input id="name" required><label for="mail">Email Address</label><input id="mail" type="email" required><label for="pass">Password</label><input id="pass" type="password" required><label for="gender">Gender</label><select id="gender"><option>Select</option><option>Female</option><option>Male</option><option>Prefer not to say</option></select><label><input type="checkbox" required> I agree to the terms.</label><button type="submit">Create Account</button></form></main>
