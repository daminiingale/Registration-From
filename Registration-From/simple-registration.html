<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Registration</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="simple-page">
<main class="card simple-card"><h1>Create Account</h1><form><label for="u">Username</label><input id="u" name="username" placeholder="Enter username" required><label for="e">Email</label><input id="e" name="email" type="email" placeholder="Enter email" required><label for="p">Password</label><input id="p" name="password" type="password" placeholder="Create password" required><label for="c">Confirm Password</label><input id="c" name="confirm" type="password" placeholder="Confirm password" required><button type="submit">Register</button></form></main>
</body>
</html>
