<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Admission</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="student-page">
<main class="card student-card"><h1>Student Admission Form</h1><form><label for="school">School / College Name</label><input id="school" required><label for="fname">Student First Name</label><input id="fname" required><label for="lname">Student Last Name</label><input id="lname" required><label for="parent">Parent Name</label><input id="parent" required><label for="phone">Phone Number</label><input id="phone" type="tel" required><label for="email">Email</label><input id="email" type="email" required><label for="sport">Preferred Sport</label><select id="sport"><option>Select sport</option><option>Cricket</option><option>Football</option><option>Badminton</option><option>Other</option></select><label><input type="checkbox" required> I confirm the information is correct.</label><button type="submit">Submit Admission</button></form></main>
</body>
</html>
