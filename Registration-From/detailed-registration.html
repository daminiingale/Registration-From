<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detailed Registration</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="detailed-page">
<main class="card detailed-card"><h1>Detailed Registration Form</h1><form><h2>Personal Details</h2><label for="fn">Full Name</label><input id="fn" required><label for="dob">Date of Birth</label><input id="dob" type="date"><label for="de">Email</label><input id="de" type="email" required><label for="mob">Mobile Number</label><input id="mob" type="tel"><label for="occ">Occupation</label><input id="occ"><h2>ID Details</h2><label for="idt">ID Type</label><select id="idt"><option>Select ID type</option><option>Passport</option><option>Driving Licence</option><option>Other</option></select><label for="idn">ID Number</label><input id="idn"><label for="authority">Issue Authority</label><input id="authority"><label for="issue">Issue Date</label><input id="issue" type="date"><label for="expiry">Expiry Date</label><input id="expiry" type="date"><h2>Address</h2><label for="address">Street Address</label><textarea id="address" rows="3"></textarea><label for="city">City</label><input id="city"><label for="state">State</label><input id="state"><label for="pin">Postal Code</label><input id="pin"><button type="submit">Submit Registration</button></form></main>
</body>
</html>
