<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login and Register</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
<main class="card split-card"><section class="welcome-panel"><h1>Welcome Back!</h1><p>Sign in to continue.</p></section><section class="register-panel"><h2>Create Account</h2><form><label for="rn">Full Name</label><input id="rn" required><label for="re">Email</label><input id="re" type="email" required><label for="rp">Password</label><input id="rp" type="password" required><label for="rc">Confirm Password</label><input id="rc" type="password" required><button type="submit">Register</button></form></section></main>
</body>
</html>
